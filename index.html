<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Queue Cue</title>
  <style>
    :root { --text: #1d1b2e; --muted: #5b5870; --bg: #ffffff; --accent: #5440ff; }
    @media (prefers-color-scheme: dark) {
      :root { --text: #ecebf5; --muted: #aeaac4; --bg: #17151f; --accent: #9d90ff; }
    }
    body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 680px; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { font-size: 1.7em; margin: 0 0 8px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <h1>Queue Cue</h1>
  <p>A Chrome extension that tells you when a website's live-chat agent joins your chat or replies, so you
  can leave the chat tab and get on with other things. Works with Tawk.to chat.</p>
  <ul>
    <li><a href="demo.html">Try it on the demo chat</a></li>
    <li><a href="privacy.html">Privacy policy</a></li>
    <li><a href="https://github.com/queuecue/queue-cue/issues">Help and feedback on GitHub</a></li>
  </ul>
</main>
</body>
</html>
